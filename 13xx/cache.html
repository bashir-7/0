<!doctype html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashir / PS4  / 13.xx</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}
body {
    background: #ffffff;
    color: #111111;
    font-size: 20px;
    text-align: center;
    overflow: hidden;
}
.info {
    position: absolute;
    top: 45%;
    left: 50%;
    font-size: 22px;
    font-family: monospace;
    color: #111111;
    transform: translate(-50%, -50%);
    white-space: nowrap;
}
</style>
<script>
(function () {
    // Return to index without changing the exploit files or their behavior.
    try {
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        if (histlength > 1) history.go(-histlength);
    } catch (e) {}

    function setMessage(text) {
        var el = document.getElementById('msgs');
        if (el) el.textContent = text;
    }

    function DLProgress(e) {
        if (!e || !e.total) return;
        var pct = Math.round((e.loaded / e.total) * 100);
        setMessage('جارٍ التثبيت ... ' + pct + '%');
    }

    function DisplayCacheProgress() {
        setTimeout(function () {
            setMessage('الذاكرة المؤقتة OK');
        }, 2000);
        setTimeout(function () {
            location.replace('index.html');
        }, 3000);
    }

    window.addEventListener('load', function () {
        var ac = window.applicationCache;
        if (!ac) return;
        ac.addEventListener('progress', DLProgress, false);
        ac.addEventListener('cached', DisplayCacheProgress, false);
        ac.addEventListener('updateready', DisplayCacheProgress, false);
        ac.addEventListener('error', function () {
            setMessage('تعذر تحديث الذاكرة المؤقتة');
        }, false);
    });
})();
</script>
</head>
<body>
<div id="msgs" class="info">جارٍ تجهيز الذاكرة المؤقتة ...</div>
</body>
</html>

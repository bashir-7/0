<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>بشيرلصيانة الاجهزة الالكترونية</title>
    <style>
html,body{margin:0;min-height:100%;background:transparent;color:#fff;font-family:Arial,Tahoma,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 18px 36px;direction:rtl;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.85);overflow-x:hidden}
#brand{width:90%;max-width:980px;margin:28px auto 0;padding:14px;border:1px solid rgba(0,191,255,.55);border-radius:14px;background:rgba(0,8,28,.72);box-sizing:border-box}
#brand b{font-size:26px;color:#fff}
#spin{position:fixed;top:50%;left:50%;width:54px;height:54px;margin:-27px;border:4px solid rgba(255,255,255,.12);border-top-color:#22b8ff;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:850px;padding:18px 14px;border:1px solid rgba(0,191,255,.72);border-radius:14px;background:rgba(0,8,28,.78);color:#ffaaaa;font-size:30px;font-weight:bold;box-sizing:border-box}
#wrap{width:90%;max-width:980px;margin:35px auto 0}
body.log #state{display:block;margin:0 0 12px;padding:18px 14px;border:1px solid rgba(0,191,255,.55);border-radius:14px;background:rgba(0,8,28,.72);font-size:28px}
body.log #out{display:block;white-space:pre-wrap;font:12px/1.55 Consolas,monospace;direction:ltr;text-align:left;background:rgba(0,8,28,.82);border:1px solid rgba(0,191,255,.45);border-radius:14px;padding:14px;height:calc(100vh - 190px);overflow:auto}
#state,#out{display:none}.ok,.safe{color:#a7ffd0!important}.bad,.danger{color:#ffaaaa!important}.warn{color:#ffe39a!important}
body.done #spin,body.fail #spin{display:none}body.fail #msg{display:block}body.log #spin,body.log #msg{display:none}
@media(max-width:900px){body{padding:20px 10px 28px}#brand,#wrap{width:96%}#brand b{font-size:23px}#msg{font-size:27px}body.log #state{font-size:24px}}
</style>
  </head>
  <body>
    <div id="brand">
      <b>بشيرلصيانة الاجهزة الالكترونية</b>
    </div>
    <div id="spin"></div>
    <div id="msg">أعد تشغيل جهاز PS4 ثم حاول مرة أخرى</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>

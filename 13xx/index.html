<!doctype html>
<html lang="ar" dir="rtl" manifest="13xx.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020713">
  <title>Bashir • PS4 • 13.02 — 13.52</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .jb13-wrap{max-width:980px;margin:0 auto;padding-top:18px}
    .brand13{font-size:28px;margin:8px auto 4px;font-weight:800}
    .range13{font-size:18px;opacity:.86;margin:0 auto 18px}
    .status13{width:92%;max-width:980px;margin:34px auto 0;padding:20px 16px;box-sizing:border-box;border:1px solid rgba(0,191,255,.72);border-radius:16px;background:rgba(0,8,28,.76);box-shadow:0 10px 35px rgba(0,0,0,.25)}
    #spin{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.16);border-top-color:#fff;border-radius:50%;animation:spin13 .85s linear infinite}
    @keyframes spin13{to{transform:rotate(360deg)}}
    #msg{font-size:28px;line-height:1.6;font-weight:700;min-height:52px}
    #state,#out{display:none}
    body.done #spin,body.fail #spin{display:none}
    body.fail #msg{color:#ffd7d7}
    body.log #spin,body.log #msg{display:none}
    body.log #state,body.log #out{display:block}
    body.log #wrap{margin:20px auto;width:92%;max-width:980px}
    body.log #state{font-size:24px;margin-bottom:10px}
    body.log #out{white-space:pre-wrap;text-align:left;direction:ltr;font:12px/1.45 Consolas,monospace;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;height:calc(100vh - 190px);overflow:auto}
    .ok{color:#9ff0b9}.bad{color:#ff9f9f}.warn{color:#ffe49a}
    @media(max-width:700px){.brand13{font-size:22px}.range13{font-size:15px}.status13{width:96%;margin-top:25px}#msg{font-size:23px}}
  </style>
</head>
<body>
  <main class="jb13-wrap">
    <div class="brand13">بشير • PS4 Jailbreak</div>
    <div class="range13">دعم Firmware 13.02 — 13.52</div>
    <section class="status13" aria-live="polite">
      <div id="spin"></div>
      <div id="msg">جارٍ تجهيز بيئة التشغيل…</div>
    </section>
    <div id="wrap"><div id="state"></div><div id="out"></div></div>
  </main>
  <script type="module">import "./jb.js";</script>
</body>
</html>

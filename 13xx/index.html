<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashir / PS4 / 13.xx</title>
<link rel="stylesheet" href="../style.css">
<style>
body { padding-top: 22px; }
#console {
    display:block; width:90%; max-width:980px; margin:78px auto 0; padding:18px 14px;
    box-sizing:border-box; border:1px solid rgba(0,191,255,.72); border-radius:14px;
    background:rgba(0,8,28,.72); color:#fff; font-size:25px; line-height:1.6;
    text-shadow:0 1px 3px rgba(0,0,0,.85); direction:rtl; unicode-bidi:plaintext;
}
#console .line { margin:6px 0; padding:7px 8px; border-radius:8px; }
#console .line:first-child { background:rgba(0,120,220,.08); }
.ok{color:#a7ffd0}.bad{color:#ffaaaa}.warn{color:#ffe39a}
@media(max-width:900px){ body{padding:20px 10px 28px!important} #console{width:96%;font-size:28px;line-height:1.55;margin-top:62px} }
</style>
</head>
<body>
<h1>Bashir / PS4 / 13.xx</h1>
<hr>
<div id="console"><div class="line warn">جارٍ التحقق من النظام...</div></div>
<script>
(function () {
    var con=document.getElementById("console");
    function print(msg,cls){var d=document.createElement("div");d.className="line"+(cls?" "+cls:"");d.textContent=msg;con.appendChild(d);}
    var params=new URLSearchParams(location.search), SUPPORTED={1302:1,1304:1,1350:1,1352:1}, key=null,fwnum=null;
    var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if(m){var minor=parseInt(m[2],10);key=m[1]+"."+String(minor).padStart(2,"0");fwnum=parseInt(m[1],10)*100+minor;}
    var forced=params.get("force")==="1", supported=forced||(fwnum!==null&&SUPPORTED[fwnum]===1);
    con.innerHTML=""; print("إصدار النظام: "+(key||"غير معروف"),supported?"ok":"bad");
    function go(){print("جارٍ تشغيل الثغرة...","warn");location.replace("jb.html"+location.search);}
    function waitForTap(msg,action){if(msg)print(msg,"warn");function fire(){window.removeEventListener("click",fire);window.removeEventListener("keydown",fire);action();}window.addEventListener("click",fire);window.addEventListener("keydown",fire);}
    if(!supported){print("إصدار غير مدعوم — اضغط X أو انقر للتشغيل بالقوة","bad");waitForTap("",go);return;}
    var ac=window.applicationCache;
    if(!ac||!document.documentElement.hasAttribute("manifest")){go();}
    else if(!navigator.onLine){print("الإنترنت غير متصل — سيتم التشغيل من الكاش","ok");go();}
    else if(ac.status===ac.IDLE){print("الكاش جاهز — بدء التشغيل","ok");go();}
    else if(ac.status===ac.UPDATEREADY){try{ac.swapCache();}catch(e){}print("تم تحديث الكاش — اضغط X أو انقر لإعادة التحميل","ok");waitForTap("",function(){location.reload();});}
    else{print("جارٍ تجهيز الكاش لأول تشغيل...","warn");ac.addEventListener("downloading",function(){print("بدء تحميل ملفات الكاش...");});ac.addEventListener("progress",function(e){if(e&&e.total)print("الكاش: "+Math.round(e.loaded/e.total*100)+"%");});ac.addEventListener("cached",function(){print("تم حفظ الكاش — جاهز للعمل بدون إنترنت","ok");waitForTap("اضغط X أو انقر لبدء التشغيل",go);});ac.addEventListener("updateready",function(){try{ac.swapCache();}catch(e){}print("تم تحديث الكاش — اضغط X أو انقر لإعادة التحميل","ok");waitForTap("",function(){location.reload();});});ac.addEventListener("noupdate",function(){print("الكاش جاهز للعمل بدون إنترنت","ok");go();});ac.addEventListener("error",function(){print("تعذر تحديث الكاش — سيتم محاولة التشغيل مباشرة","bad");waitForTap("اضغط X أو انقر للمتابعة",go);});ac.addEventListener("obsolete",function(){print("الكاش قديم — سيتم التشغيل مباشرة","warn");waitForTap("اضغط X أو انقر للمتابعة",go);});}
})();
</script>
</body>
</html>

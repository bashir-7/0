<!-- Bashir / PS4 / 12.xx / 13.xx -->
<html manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bashir</title>
    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: center;
            background: #020713 url("../background.jpg") center center / cover no-repeat;
            color: #ffffff;
            font-family: Arial, Tahoma, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            padding: 28px 18px 36px;
            text-shadow: 0 1px 3px rgba(0,0,0,.85);
            position: relative;
        }
        body:before {
            content: "";
            position: fixed;
            z-index: -1;
            left: 0; right: 0; top: 0; bottom: 0;
            background: rgba(0, 4, 18, .16);
        }
        #console {
            font-family: monospace;
            white-space: pre;
            direction: rtl;
            text-align: center;
        }
        .ok   { color: #1a7a1a; }
        .bad  { color: #cc0000; }
        .warn { color: #ffd166; }
        .warning-box {
            display: inline-block;
            max-width: min(92vw, 760px);
            margin: 14px auto;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            line-height: 1.8;
        }
        .warning-box .info-line { display: block; }
    </style>
    <script>
    if (window.applicationCache && window.applicationCache.status == 0) {
        window.location.replace("cache.html");
    }
    </script>
</head>
<body>
    بشير لصيانة الاجهزة الالكترونية والرقمية شارع طرابلس الداخلى اجدابيا<br>
     <br>
    <br>
    <pre id="console"></pre>
</body>
<script>
(function () {
    var con = document.getElementById("console");

    function print(msg, cls) {
        var span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = msg + "\n";
        con.appendChild(span);
    }

    function printStatusBox(firmware, isSupported, warning) {
        var box = document.createElement("div");
        box.className = "warning-box";

        var firmwareLine = document.createElement("span");
        firmwareLine.className = "info-line";
        firmwareLine.textContent = "البرامج الثابتة: " + firmware;
        box.appendChild(firmwareLine);

        var supportedLine = document.createElement("span");
        supportedLine.className = "info-line " + (isSupported ? "ok" : "bad");
        supportedLine.textContent = "معتمد: " + (isSupported ? "نعم" : "لا");
        box.appendChild(supportedLine);

        if (warning) {
            var warningLine = document.createElement("span");
            warningLine.className = "warn info-line";
            warningLine.textContent = warning;
            box.appendChild(warningLine);
        }

        con.appendChild(box);
        con.appendChild(document.createTextNode("\n"));
    }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    printStatusBox(key || "غير معروف", supported, supported ? "" : "برامج ثابتة غير مدعومة — اضغط  X للتشغيل على أي حال");

    var target = "jb.html" + location.search;

    function go() {
        print("loading exploit...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        print(msg, "warn");
        function fire() {
            window.removeEventListener("click",   fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click",   fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        // التحذير موجود بالفعل داخل نفس الإطار مع معلومات النظام والاعتماد. 
        waitForTap("", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        print("offline — running from cache", "ok");
        go();
    } else if (ac.status === ac.IDLE) {
        print("cached", "ok");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        print("update downloaded", "ok");
        waitForTap("التحديث جاهز — اضغط على الزر X لإعادة التحميل", function () { location.reload(); });
    } else {
        print("checking cache...");
        ac.addEventListener("downloading",
            function () { print("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                print("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            print("cached for offline use", "ok");
            waitForTap("التخزين المؤقت— اضغط على X للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            print("update downloaded", "ok");
            waitForTap("التحديث جاهز — اضغط على X لإعادة التحميل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            print("cached — offline ready", "ok");
            go();
        }, false);
        ac.addEventListener("error", function () {
            print("cache unavailable");
            waitForTap("فشل التخزين المؤقت — اضغط على X للتشغيل على أية حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            print("cache obsolete");
            waitForTap("ذاكرة التخزين المؤقت قديمة — اضغط على X للتشغيل", go);
        }, false);
    }
})();
</script>
</html>

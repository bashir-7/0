<!doctype html>
<html lang="ar" dir="rtl" manifest="13xx.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<title>Bashir • تثبيت 13.xx</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<h1>Bashir • PS4 Jailbreak</h1>
<hr>
<h1 id="msgs" style="font-size:32px;margin-top:70px">بدء تجهيز ذاكرة التخزين المؤقت لإصدارات 13.02 — 13.52…</h1>
<script>
(function(){
  var app=window.applicationCache, msg=document.getElementById('msgs');
  function set(t){ if(msg) msg.innerHTML=t; }
  function go(){
    try { location.replace('index.html'); }
    catch(e) { location.href='index.html'; }
  }
  function pct(e){
    var p=(e && e.lengthComputable && e.total) ? Math.round(e.loaded/e.total*100) : null;
    set('جارٍ تجهيز ملفات 13.xx: <span dir="ltr">'+(p===null?'…':p+'%')+'</span>');
  }
  if(!app){ set('تم تحميل الواجهة.'); return; }
  app.addEventListener('checking',function(){set('جارٍ فحص التخزين المؤقت…');},false);
  app.addEventListener('downloading',function(){set('جارٍ حفظ ملفات 13.xx للاستخدام دون إنترنت…');},false);
  app.addEventListener('progress',pct,false);
  app.addEventListener('cached',function(){
    set('تم حفظ ملفات 13.xx بنجاح ✔<br><small>يمكن الآن فصل الإنترنت.</small>');
    setTimeout(go,900);
  },false);
  app.addEventListener('updateready',function(){
    try{app.swapCache();}catch(e){}
    set('تم تحديث التخزين المؤقت بنجاح ✔');
    setTimeout(go,700);
  },false);
  app.addEventListener('noupdate',function(){
    set('ملفات 13.xx موجودة مسبقًا ✔<br><small>جارٍ فتح الواجهة المحلية…</small>');
    setTimeout(go,500);
  },false);
  app.addEventListener('obsolete',function(){set('تمت إعادة تهيئة التخزين المؤقت. أعد فتح الصفحة مع الإنترنت.');},false);
  app.addEventListener('error',function(){
    set('تعذر تحديث التخزين المؤقت.<br><small>إذا كان الإنترنت مفصولًا، افتح نسخة 13.xx المحفوظة مباشرة. وإذا كان متصلًا فأعد المحاولة مرة واحدة.</small>');
  },false);
})();
</script>
</body>
</html>

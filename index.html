<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>Bashir PS4/PS5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
(function(){
  var ua=navigator.userAgent||"";
  var m=ua.match(/PlayStation 4[ \/]([\d.]+)/i);
  var fw=m?m[1]:"Unknown";
  var n=parseFloat(fw);
  var msg=document.getElementById("msgs");
  function show(t){ if(msg) msg.innerHTML=t; }
  function go(url){ try{ location.replace(url); }catch(e){ location.href=url; } }
  if(!m){ document.addEventListener("DOMContentLoaded",function(){show("مخصص فقط لأجهزة PS4");}); return; }
  if(n>=9.00 && n<=9.60){ go("cache900.html"); return; }
  if(n>=10.00 && n<=11.02){ go("cachecss.html"); return; }
  if(n>=11.50 && n<=13.00){ go("cacheslopkit.html"); return; }
  if(n>=13.02 && n<=13.52){ go("13xx/cache13.html"); return; }
  document.addEventListener("DOMContentLoaded",function(){show("نظام غير مدعوم: <span style=\"color:#ff7070\">"+fw+"</span>");});
})();
</script>
<h1>Bashir / PS4 / 9.00 — 13.52</h1>
<hr>
<br>
<h1 id="msgs" style="font-size: 34px;margin-top: 77px;margin-bottom: 455px;">جارٍ فحص إصدار النظام وتحضير Jailbreak...</h1>

</body>
</html>
